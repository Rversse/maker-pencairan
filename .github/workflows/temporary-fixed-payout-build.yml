name: Temporary fixed payout build validation
on:
  push:
    branches:
      - feat/fixed-payout-cards-vehicle-types-2026-10-12
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Build
        id: build
        run: npm run build
      - name: Record temporary result
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$INSTALL_OUTCOME" = "success" ] && [ "$BUILD_OUTCOME" = "success" ]; then
            printf 'PASS\n' > .temporary-build-result
          else
            printf 'FAIL: install=%s build=%s\n' "$INSTALL_OUTCOME" "$BUILD_OUTCOME" > .temporary-build-result
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .temporary-build-result
          if ! git diff --cached --quiet; then
            git commit -m "chore: record temporary build result"
            git push https://x-access-token:$GH_TOKEN@github.com/Rversse/maker-pencairan.git HEAD:feat/fixed-payout-cards-vehicle-types-2026-10-12
          fi
