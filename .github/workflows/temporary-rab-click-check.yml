name: Temporary Koperasi RAB build check
on:
  push:
    branches:
      - fix/koperasi-arutala-rab-click-2026-10-13
  pull_request:
    branches:
      - main
    paths:
      - 'src/App.tsx'
      - '.github/workflows/temporary-rab-click-check.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
