name: Check Maker-Pencairan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Check Maker Edge Functions
        run: |
          deno check supabase/functions/maker-auth/index.ts
          deno check supabase/functions/maker-admin-accounts/index.ts
          deno check supabase/functions/maker-history/index.ts

      - name: Build
        run: npm run build
